# Component-repo secret scan. Install as .github/workflows/scan-secrets.yml
#
# Calls reusable-scan-secrets.yml (formerly the gitleaks job inside
# reusable-standards.yml, before that name was retired — see that workflow's
# header in tzervas/ap-workflows for why).
#
# NOTE THE CONCURRENCY BLOCK — or rather, note what is missing from it.
#
# There is deliberately NO `cancel-in-progress` here. On a scheduled scan,
# cancelling the in-flight run when the next tick arrives means the scan that was
# actually going to find something gets killed, and the repo shows a cancelled
# (not failed, not passed) status. Cancellation is correct for CI on a
# fast-moving branch; it is wrong for a scan whose whole value is that it
# finishes. Push/PR runs of this workflow are cheap enough to let queue.
#
# The reusable workflow always scans full git history (fetch-depth: 0, no
# --no-git) regardless of trigger — a clean working tree can still carry a key
# in its history, so there is no "shallow" mode to opt into here.
name: scan-secrets

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # 05:23 UTC daily — off the hour and offset from other scheduled fleet scans
    # so they don't all stampede the self-hosted pool at the same tick.
    - cron: '23 5 * * *'

permissions:
  contents: read

concurrency:
  group: scan-secrets-${{ github.ref }}
  # cancel-in-progress intentionally omitted; see the header.

jobs:
  gitleaks:
    uses: tzervas/ap-workflows/.github/workflows/reusable-scan-secrets.yml@main
    with:
      runner-labels: '["self-hosted","linux","x64","podman","small","shell"]'
