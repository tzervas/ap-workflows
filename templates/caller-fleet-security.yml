# Fleet security scan — install as .github/workflows/fleet-security.yml
#
# Thin caller. Policy lives in
# tzervas/ap-workflows/.github/workflows/reusable-fleet-security.yml.
#
# Tier: dev scans the working tree; main tier and the weekly schedule scan the
# full git history for secrets.
#
# THE `cancel-in-progress` EXPRESSION BELOW IS LOAD-BEARING, NOT COSMETIC.
# A scheduled self-hosted scan under an unconditional `cancel-in-progress: true`
# silently NEVER RUNS when the fleet is not polling this repo: the run queues
# waiting for a runner, the next scheduled tick cancels it, and it reports
# `cancelled` rather than `failed` — so nothing alerts and the repo looks
# scanned. Scheduled runs are therefore never cancelled; only push/PR runs are
# superseded.
#
# PIN DISCIPLINE: `@v0.1` is a MOVING tag — see
# https://github.com/tzervas/ap-workflows#tag-discipline
name: fleet-security

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

concurrency:
  group: fleet-security-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

jobs:
  fleet-security:
    uses: tzervas/ap-workflows/.github/workflows/reusable-fleet-security.yml@v0.1
    with:
      tier: auto
      # Set trivy-required: true once trivy is on the runner image — that is what
      # promotes the filesystem scan from advisory to a hard gate.
