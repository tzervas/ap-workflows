# Component-repo CI. Install as .github/workflows/ci.yml
#
# The whole gate is centralized: to change policy for all 46 repos, edit
# reusable-rust-ci.yml in tzervas/ap-workflows — not 46 files.
#
# The job name stays `check` because that is the context protec-main and
# protec-dev require across the train. Do not rename it.
name: ci

on:
  workflow_dispatch:
    inputs:
      depth:
        description: 'Gate depth'
        type: choice
        options: [lint, check, check+test, full]
        default: check+test
      runner:
        description: 'Where to run'
        type: choice
        options: [github-hosted, self-hosted-fleet]
        default: github-hosted
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: tzervas/ap-workflows/.github/workflows/reusable-rust-ci.yml@main
    with:
      # Dispatch overrides win; push/PR uses the train defaults.
      depth: ${{ inputs.depth || 'check+test' }}
      runner-labels: >-
        ${{ inputs.runner == 'self-hosted-fleet'
            && '["self-hosted","linux","x64","podman"]'
            || '["ubuntu-latest"]' }}
