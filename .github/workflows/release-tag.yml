# Move the major tag the fleet is pinned to.
#
# THE CONTRACT
# ------------
# Callers pin `@v1`. `v1` is a MOVING tag: it is repointed at every green commit
# on main whose `VERSION` still has major 1. That is what makes a central
# security fix or a dependency patch reach ~225 repos with no per-repo PR.
#
# A breaking change is therefore not "a commit on main" — it is an edit to
# `VERSION` that raises the major. Raising it to `2.0.0` creates `v2` and leaves
# `v1` frozen exactly where it was, so every caller keeps working and migrates
# by editing one line, on its own schedule. That edit is the human gate.
#
# The tag only moves when `self-test` has passed for this exact commit. An
# auto-merged patch bump that broke a required context does not get to propagate.
name: release-tag

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'terraform/**'
  workflow_dispatch:

concurrency:
  # Never cancel a tag move in flight — a half-moved tag is worse than a slow one.
  group: release-tag
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  move-tag:
    name: move major tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: v
        run: |
          set -euo pipefail
          [ -f VERSION ] || { echo "::error::VERSION file missing"; exit 1; }
          version="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION must be MAJOR.MINOR.PATCH, got '$version'"
            exit 1
          fi
          major="${version%%.*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=v$major"   >> "$GITHUB_OUTPUT"
          echo "VERSION=$version -> moving tag v$major"

      - name: Require self-test green for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Poll rather than assume: the tag is the fleet's propagation channel,
          # so "I could not tell" must behave like "no", not like "yes".
          for i in $(seq 1 40); do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}" \
              --jq '[.workflow_runs[] | select(.name=="self-test")] | sort_by(.created_at) | last
                    | "\(.status)/\(.conclusion)"' 2>/dev/null || echo "none")"
            echo "attempt $i: self-test = $state"
            case "$state" in
              completed/success) echo "self-test green"; exit 0 ;;
              completed/*)       echo "::error::self-test is $state for ${GITHUB_SHA} — not moving the tag"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::timed out waiting for self-test on ${GITHUB_SHA}. Not moving the tag." >&2
          echo "::error::A tag that moves on an unverified commit is the whole risk this gate exists to prevent." >&2
          exit 1

      - name: Move the major tag
        env:
          MAJOR: ${{ steps.v.outputs.major }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "mycelium-workflows[bot]"
          git config user.email "noreply@github.com"
          # The exact-version tag is immutable and created once; the major tag moves.
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "v${VERSION} already tagged — leaving it alone"
          else
            git tag -a "v${VERSION}" -m "mycelium-workflows v${VERSION}"
            git push origin "v${VERSION}"
          fi
          git tag -f -a "$MAJOR" -m "moving major tag -> v${VERSION} (${GITHUB_SHA})"
          git push -f origin "$MAJOR"
          {
            echo "### Moved \`$MAJOR\` -> \`v${VERSION}\`"
            echo ""
            echo "Commit \`${GITHUB_SHA}\`. Every caller pinned at \`@$MAJOR\` picks this up on its next run."
          } >> "$GITHUB_STEP_SUMMARY"
