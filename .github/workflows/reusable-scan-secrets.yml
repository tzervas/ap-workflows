# Reusable full-history secret scan for the fleet.
#
# NAMING: THIS FILE REPLACES reusable-standards.yml
# ----------------------------------------------------
# This workflow, and its sibling `reusable-ci-yaml.yml`, together replace what
# used to be a single file, `reusable-standards.yml` (three jobs: shell-lint,
# yaml-validate, gitleaks). That name is now frozen out under the fleet's naming
# rule (`reusable-<domain>-<concern>.yml`, domain one of ci|scan|policy|release,
# concern specific and singular) — "standards" names a category, not a concern,
# and PR #4 independently claimed the identical `reusable-standards.yml` path for
# a completely different concern (the branch/release contract). See
# `reusable-ci-yaml.yml`'s header for the full split rationale, including why the
# former shell-lint job was dropped rather than renamed (it duplicates PR #3's
# `reusable-shell-ci.yml`).
#
# Secret scanning gets its own file rather than being bundled with lint jobs
# because it is a different concern with a different failure meaning: a lint
# failure says "this code doesn't meet a style/correctness bar," a gitleaks
# failure says "a credential is live in this history, rotate it now." Conflating
# the two under one name makes it harder to reason about severity and ownership.
#
# WHY ASSERT, NOT INSTALL
# ------------------------
# A reusable workflow that installs its own toolchain at runtime pays that cost on
# every caller, every run, forever — and worse, it HIDES the real problem: the
# runner image is missing a tool it should already carry, and nobody ever finds
# out because the job goes green anyway. A silent pass is worse than a loud
# failure (see the fleet's severity contract). So the job here asserts its tools
# up front and fails with the exact fix — which class label the job is missing —
# rather than fetching a binary.
#
# WHY GITLEAKS SCANS FULL HISTORY
# ---------------------------------
# A tree can look clean while the history still carries a key. Not hypothetical:
# `homelab-infra-private` has exactly that shape today. So checkout here uses
# `fetch-depth: 0` and the scan omits `--no-git` — scanning only the working tree
# would miss precisely the case this job exists to catch.
#
# JOB LABEL SCHEMA (mandatory, both tokens, in this order after the base labels):
#   runs-on: [self-hosted, linux, x64, podman, <size>, <class>]
#     size:  micro | small | medium | large   (no size -> may land on micro and OOM)
#     class: shell | python | rust | docs | gpu (no class -> undefined rootfs)
# This job is `small` / `shell` — scan work, not a build.
#
# NOT VERIFIED: whether the fleet's `shell`-class runner image actually preinstalls
# gitleaks. That is the assumption this file rests on, per the assert-don't-install
# contract; it was not checked against a live runner (no runner-fleet access from
# this task). If the image does not carry it yet, the job fails loudly naming
# exactly what's missing, which is the intended behaviour rather than a bug.
name: Reusable Scan Secrets

on:
  workflow_call:
    inputs:
      runner-labels:
        description: 'JSON array of runner labels. Must carry both a size and a class token (see job label schema above).'
        required: false
        type: string
        default: '["self-hosted","linux","x64","podman","small","shell"]'
      gitleaks-version:
        description: 'Pinned gitleaks release expected on the shell-class image (used only in the error message — this job asserts, it does not install)'
        required: false
        type: string
        default: '8.30.1'
      timeout-minutes:
        description: 'Job timeout'
        required: false
        type: number
        default: 15

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history on purpose — see "WHY GITLEAKS SCANS FULL HISTORY" above.
          # A shallow or --no-git scan would miss a secret that only exists in a
          # past commit, which is exactly the case this job exists to catch.
          fetch-depth: 0

      - name: assert toolchain
        run: |
          set -eu
          command -v gitleaks >/dev/null || {
            echo "::error::gitleaks missing — this job needs the 'shell' class label (pinned ${{ inputs.gitleaks-version }} expected on that image)"
            exit 1
          }
          gitleaks version

      - name: gitleaks detect (full history)
        run: |
          set -eu
          gitleaks detect --source . --verbose --redact --exit-code 1
