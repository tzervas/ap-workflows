# Reusable Rust CI for the Mycelium train.
#
# Component repos call this instead of carrying their own copy, so a policy change
# is one commit here rather than 46 PRs.
#
# NOTE ON INPUT TYPES (this is a GitHub constraint, not a choice):
# `workflow_call` supports only string / number / boolean / environment. There is
# no `choice` and no radio widget here — dropdowns exist only on
# `workflow_dispatch`, which is why the human-facing selector lives in
# control-panel.yml. String inputs that model an enum are validated below and
# refuse loudly on a bad value rather than silently defaulting.
name: Reusable Rust CI

on:
  workflow_call:
    inputs:
      rust-version:
        description: 'Toolchain (train MSRV is 1.96.1)'
        required: false
        type: string
        default: '1.96.1'
      depth:
        description: 'Gate depth: lint | check | check+test | full'
        required: false
        type: string
        default: 'check+test'
      runner-labels:
        description: 'JSON array of runner labels, e.g. ["ubuntu-latest"] or ["self-hosted","linux","x64","podman"]'
        required: false
        type: string
        default: '["ubuntu-latest"]'
      cargo-jobs:
        description: 'Cargo parallelism. 0 = inherit (the fleet exports CARGO_BUILD_JOBS from the container CPU quota)'
        required: false
        type: number
        default: 0
      all-features:
        description: 'Pass --all-features'
        required: false
        type: boolean
        default: false
      deny-warnings:
        description: 'clippy -D warnings'
        required: false
        type: boolean
        default: true
      timeout-minutes:
        description: 'Job timeout'
        required: false
        type: number
        default: 30

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Single job name on purpose: `check` is what protec-main and protec-dev
    # require across the train. Renaming it silently un-gates 46 repos.
    name: check
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Validate depth (never-silent)
        run: |
          set -eu
          case "${{ inputs.depth }}" in
            lint|check|check+test|full) : ;;
            *) echo "::error::depth must be lint|check|check+test|full, got '${{ inputs.depth }}'"; exit 1 ;;
          esac
          echo "depth=${{ inputs.depth }}"

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy

      - name: Resolve flags
        id: f
        run: |
          set -eu
          feat=""
          [ "${{ inputs.all-features }}" = "true" ] && feat="--all-features"
          echo "feat=$feat" >> "$GITHUB_OUTPUT"
          clip="-W warnings"
          [ "${{ inputs.deny-warnings }}" = "true" ] && clip="-D warnings"
          echo "clip=$clip" >> "$GITHUB_OUTPUT"
          # 0 means inherit. gha-runner-ctl exports CARGO_BUILD_JOBS equal to the
          # container CPU quota, because `nproc` reports HOST cores inside a
          # cpu-limited container and cargo would otherwise spawn one rustc per
          # host core and blow the memory cap.
          if [ "${{ inputs.cargo-jobs }}" != "0" ]; then
            echo "CARGO_BUILD_JOBS=${{ inputs.cargo-jobs }}" >> "$GITHUB_ENV"
          fi
          echo "cargo jobs: ${CARGO_BUILD_JOBS:-inherited}"

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets ${{ steps.f.outputs.feat }} -- ${{ steps.f.outputs.clip }}

      - name: cargo check
        if: inputs.depth != 'lint'
        run: cargo check --workspace --all-targets ${{ steps.f.outputs.feat }}

      - name: cargo test
        if: inputs.depth == 'check+test' || inputs.depth == 'full'
        run: cargo test --workspace ${{ steps.f.outputs.feat }}

      - name: cargo doc
        if: inputs.depth == 'full'
        run: cargo doc --workspace --no-deps ${{ steps.f.outputs.feat }}
        env:
          RUSTDOCFLAGS: -D warnings
