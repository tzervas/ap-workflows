# CI for the policy-contract checker script itself.
#
# NOT this repo's self-test: it does not gate every PR against this repo's own contract (this
# repo has no `dev` branch and ships workflow definitions, not a product with source of its
# own). It tests one thing — that `scripts/standards_check.py`, the checker `reusable-
# policy-contract.yml` runs, still behaves — and only runs when that checker, its fixtures, or
# the workflow/template that call it change. `standards_selftest.py` asserts BOTH directions for
# every rule: the dirty fixture produces the finding, and the clean fixture produces nothing. A
# rule that silently stops firing is worse than no rule — it is a gate that is off while
# looking on.
#
# It also re-checks that every workflow and template in this repo parses, because the checker's
# own rule 6 exists for a bug that broke 15 of 22 repos here.
name: ci-checker

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'scripts/standards_check.py'
      - 'scripts/standards_selftest.py'
      - '.github/workflows/reusable-policy-contract.yml'
      - '.github/workflows/ci-checker.yml'
      - 'templates/caller-policy-contract.yml'
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-checker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

jobs:
  checker:
    name: policy-contract checker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Every workflow and template parses
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(.github/workflows/*.yml .github/workflows/*.yaml templates/*.yml)
          # An empty glob here is UNKNOWN, not empty: this repo is workflow definitions, so
          # "no workflows found" means the layout moved under us, not that there is nothing
          # to check. Passing green on it would be a gate measuring nothing.
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no workflow or template files found — the repo layout changed"
            exit 1
          fi
          rc=0
          for f in "${files[@]}"; do
            if python3 -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" "$f"; then
              echo "ok   $f"
            else
              echo "::error file=$f::does not parse as YAML"
              rc=1
            fi
          done
          exit "$rc"

      - name: Rule fixtures — every rule fires, and stays quiet when clean
        run: python3 scripts/standards_selftest.py

      - name: The checker passes its own gate on this repo
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STD_REPO_ROOT: ${{ github.workspace }}
          # This repo is workflow definitions, not a product: it has no `dev` branch and no
          # PR-scoped source. Dogfooding the rules that do apply is still the point.
          STD_MODE_TRUNK_DIVERGENCE: 'off'
          STD_MODE_DOCS_WITH_CHANGE: 'warn'
          STD_MODE_EXIT_CONTRACT: 'enforce'
          STD_MODE_PYTHON_FLOOR: 'enforce'
          STD_MODE_VERSION_DRIFT: 'enforce'
        run: python3 scripts/standards_check.py
