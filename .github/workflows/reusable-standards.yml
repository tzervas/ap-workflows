# Reusable development-standards gate for the fleet: shell lint, YAML parse
# validation, and full-history secret scanning.
#
# NAMING COLLISION — READ THIS FIRST
# -----------------------------------
# As of this commit, open PR #4 (branch `ci/standards-enforcement`) ALSO adds a
# file at this exact path, `.github/workflows/reusable-standards.yml`, implementing
# a different concern (the branch/release contract: merge mode, branch targeting,
# protected refs, version policy, PR title conventions, ...). That PR was not
# mentioned in the brief this file was written against (which only checked PRs #3
# and #5), so the collision was not caught before this branch was created.
#
# This file and PR #4's file CANNOT both land at this path unmodified — whichever
# PR merges second will hit a straightforward file-add conflict. That is a human
# call (rename one, or merge the two job sets into a single file), not something
# this workflow should paper over. Flagged here, in the PR body, and in the
# handoff report.
#
# WHY ASSERT, NOT INSTALL
# ------------------------
# A reusable workflow that installs its own toolchain at runtime pays that cost on
# every caller, every run, forever — and worse, it HIDES the real problem: the
# runner image is missing a tool it should already carry, and nobody ever finds
# out because the job goes green anyway. A silent pass is worse than a loud
# failure (see the fleet's severity contract). So every job here asserts its tools
# up front and fails with the exact fix — which class label the job is missing —
# rather than fetching a binary.
#
# WHY GITLEAKS SCANS FULL HISTORY
# ---------------------------------
# A tree can look clean while the history still carries a key. Not hypothetical:
# `homelab-infra-private` has exactly that shape today. So checkout here uses
# `fetch-depth: 0` and the scan omits `--no-git` — scanning only the working tree
# would miss precisely the case this job exists to catch.
#
# JOB LABEL SCHEMA (mandatory, both tokens, in this order after the base labels):
#   runs-on: [self-hosted, linux, x64, podman, <size>, <class>]
#     size:  micro | small | medium | large   (no size -> may land on micro and OOM)
#     class: shell | python | rust | docs | gpu (no class -> undefined rootfs)
# All three jobs below are `small` / `shell` — lint and scan work, not a build.
#
# NOT VERIFIED: whether the fleet's `shell`-class runner image actually preinstalls
# shellcheck, PyYAML and gitleaks. That is the assumption this whole file rests
# on, per the assert-don't-install contract; it was not checked against a live
# runner (no runner-fleet access from this task). If the image does not carry
# them yet, every job here fails loudly with the exact missing tool, which is the
# intended behaviour rather than a bug.
name: Reusable Standards

on:
  workflow_call:
    inputs:
      runner-labels:
        description: 'JSON array of runner labels. Must carry both a size and a class token (see job label schema above).'
        required: false
        type: string
        default: '["self-hosted","linux","x64","podman","small","shell"]'
      shell-paths:
        description: 'Space-separated glob(s) of shell scripts to lint'
        required: false
        type: string
        default: '**/*.sh'
      yaml-paths:
        description: 'Space-separated glob(s) of YAML files to parse-validate'
        required: false
        type: string
        default: '.github/workflows/*.yml .github/workflows/*.yaml'
      gitleaks-version:
        description: 'Pinned gitleaks release expected on the shell-class image (used only in the error message — this job asserts, it does not install)'
        required: false
        type: string
        default: '8.30.1'
      timeout-minutes:
        description: 'Per-job timeout'
        required: false
        type: number
        default: 15

permissions:
  contents: read

jobs:
  shell-lint:
    name: shell-lint
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v4

      - name: assert toolchain
        run: |
          set -eu
          command -v bash >/dev/null || {
            echo "::error::bash missing — this job needs the 'shell' class label"
            exit 1
          }
          command -v shellcheck >/dev/null || {
            echo "::error::shellcheck missing — this job needs the 'shell' class label"
            exit 1
          }
          shellcheck --version

      - name: bash -n (syntax check)
        run: |
          set -eu
          shopt -s globstar nullglob
          files=(${{ inputs.shell-paths }})
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no shell files matched '${{ inputs.shell-paths }}' — nothing to check"
            exit 0
          fi
          status=0
          for f in "${files[@]}"; do
            echo "bash -n $f"
            bash -n "$f" || status=1
          done
          exit "$status"

      - name: shellcheck -S error
        run: |
          set -eu
          shopt -s globstar nullglob
          files=(${{ inputs.shell-paths }})
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no shell files matched '${{ inputs.shell-paths }}' — nothing to check"
            exit 0
          fi
          shellcheck -S error "${files[@]}"

  yaml-validate:
    name: yaml-validate
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v4

      - name: assert toolchain
        run: |
          set -eu
          command -v python3 >/dev/null || {
            echo "::error::python3 missing — this job needs the 'shell' class label"
            exit 1
          }
          python3 -c "import yaml" 2>/dev/null || {
            echo "::error::PyYAML missing — this job needs the 'shell' class label"
            exit 1
          }

      - name: parse every targeted YAML file
        run: |
          set -eu
          shopt -s globstar nullglob
          files=(${{ inputs.yaml-paths }})
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no YAML files matched '${{ inputs.yaml-paths }}' — nothing to check"
            exit 0
          fi
          status=0
          for f in "${files[@]}"; do
            echo "yaml.safe_load $f"
            python3 -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" "$f" \
              || { echo "::error::$f failed to parse as YAML"; status=1; }
          done
          exit "$status"

  gitleaks:
    name: gitleaks
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history on purpose — see "WHY GITLEAKS SCANS FULL HISTORY" above.
          # A shallow or --no-git scan would miss a secret that only exists in a
          # past commit, which is exactly the case this job exists to catch.
          fetch-depth: 0

      - name: assert toolchain
        run: |
          set -eu
          command -v gitleaks >/dev/null || {
            echo "::error::gitleaks missing — this job needs the 'shell' class label (pinned ${{ inputs.gitleaks-version }} expected on that image)"
            exit 1
          }
          gitleaks version

      - name: gitleaks detect (full history)
        run: |
          set -eu
          gitleaks detect --source . --verbose --redact --exit-code 1
